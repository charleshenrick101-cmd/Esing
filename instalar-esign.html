<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Instalar eSign</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
      background: #0b0b10;
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #252532;
      border-radius: 24px;
      background: #15151d;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #24243a;
      font-size: 36px;
    }
    h1 { margin: 0 0 10px; font-size: 27px; }
    p {
      margin: 0 auto 24px;
      max-width: 320px;
      color: #a9a9b5;
      line-height: 1.5;
      font-size: 15px;
    }
    .button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .button:active { transform: scale(.98); }
    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #777783;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📱</div>
    <h1>Instalar eSign</h1>
    <p>Toque no botão abaixo para iniciar a instalação do eSign no seu iPhone.</p>

    <a class="button"
       href="itms-services://?action=download-manifest&url=https://website.khoindvn.io.vn/plists/hpcdeagiebej.plist">
      Instalar eSign
    </a>

    <div class="note">Abra esta página pelo Safari no iPhone.</div>
  </main>
</body>
</html>
